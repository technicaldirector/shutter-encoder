name: Build Windows Installer

# Manual trigger only - go to the Actions tab and click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App/release version override (leave blank to auto-read Shutter.java's actualVersion)"
        required: false
        default: ""
      create_release:
        description: "Publish a GitHub release with the installer attached"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $override = "${{ inputs.version }}"
          if ($override -and $override.Trim() -ne "") {
              $ver = $override.Trim()
              Write-Host "Using version override: $ver"
          } else {
              $match = Select-String -Path "src/shutterencoder/ui/main/Shutter.java" -Pattern 'actualVersion\s*=\s*"([^"]+)"'
              if (-not $match) { throw "Could not find actualVersion in Shutter.java" }
              $ver = $match.Matches[0].Groups[1].Value
              Write-Host "Auto-detected version from Shutter.java: $ver"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Self-signed code-signing certificate. This is free and gives the exe an actual
      # Authenticode signature (helps with some AV heuristics that flag unsigned binaries),
      # but it does NOT establish a trust chain, so Windows SmartScreen will still show an
      # "unknown publisher" prompt - only a CA-issued certificate removes that. A real,
      # zero-cost path to that exists via the SignPath Foundation's free signing program for
      # qualifying open-source projects (signpath.io/product/open-source), worth pursuing
      # separately if the SmartScreen prompt itself needs to go away.
      - name: Create self-signed code-signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=Shutter Encoder (community build, unsigned by original author)" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(3)
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # jpackage's --type exe needs WiX Toolset. windows-latest runners are
      # documented to include it, but installing defensively here costs
      # ~seconds if it's already present and avoids a hard failure if that
      # ever changes.
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wixBin = Get-ChildItem "C:\Program Files*\WiX*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wixBin) {
              Add-Content $env:GITHUB_PATH $wixBin.FullName
            }
          }

      # ------------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------------
      - name: Compile Java sources
        shell: pwsh
        run: |
          # Compile from the app's actual entry point only, with -sourcepath so javac
          # pulls in every class transitively referenced from it. Do NOT explicitly list
          # every .java file under src/shutterencoder - that force-compiles PDF.java too,
          # which references a nonexistent VideoPlayer class (pre-existing dead code, not
          # reachable from the app's real entry point, so it's never actually needed).
          $classpath = (Get-ChildItem -Path src/libs -Filter *.jar | ForEach-Object { $_.FullName }) -join ";"
          javac -encoding UTF-8 -nowarn -Xlint:none -cp "$classpath" -d classes -sourcepath src src/shutterencoder/ui/main/Shutter.java

      - name: Build main jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg_input | Out-Null
          Copy-Item src/libs/*.jar pkg_input/
          jar --create --file pkg_input/shutter-encoder-main.jar --main-class shutterencoder.ui.main.Shutter -C classes .
          jar --update --file pkg_input/shutter-encoder-main.jar -C src resources

      - name: Generate Windows icon from logo.png
        shell: pwsh
        run: |
          @'
          import struct
          with open("logo.png", "rb") as f:
              png_data = f.read()
          header = struct.pack("<HHH", 0, 1, 1)
          entry = struct.pack("<BBBBHHII", 0, 0, 0, 0, 1, 32, len(png_data), 6 + 16)
          with open("logo.ico", "wb") as f:
              f.write(header)
              f.write(entry)
              f.write(png_data)
          '@ | Set-Content -Path make_icon.py -Encoding utf8
          python make_icon.py

      # ------------------------------------------------------------------
      # Third-party tools bundled into Library/
      #
      # Pinned versions (no reliable "latest" alias for these hosts) -
      # bump these manually when a newer release is needed:
      #   ExifTool   13.59   (sourceforge.net/projects/exiftool)
      #   MediaInfo  26.05   (mediaarea.net/en/MediaInfo/Download/Windows)
      #   Xpdf tools 4.06    (xpdfreader.com/download.html)
      #   LibRaw     0.22.2  (libraw.org/download)
      #
      # Resolved dynamically via GitHub's API/stable aliases:
      #   ffmpeg (BtbN "latest" tag), yt-dlp (releases/latest), 7-Zip
      #   (ip7z/7zip), tsMuxeR (justdan96/tsMuxer), bmx (bbc/bmx)
      #
      # NOT bundled: dvdauthor. The upstream project (dvdauthor.sourceforge.net)
      # only publishes source (last binary was 0.6.9 from 2010); no current,
      # trustworthy prebuilt Windows binary exists. DVD-authoring features
      # will show the app's normal "tool not found" behavior until this is
      # revisited (e.g. building from source, or extracting dvdauthor.exe
      # from a DVDStyler release).
      # ------------------------------------------------------------------
      - name: Download third-party tools into Library/
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Invoke-WebRequest's default progress-bar rendering is known to misbehave on
          # non-interactive GitHub Actions runners (slow, and can throw unrelated-looking
          # errors) - always disable it in CI.
          $ProgressPreference = "SilentlyContinue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          New-Item -ItemType Directory -Force -Path Library | Out-Null
          New-Item -ItemType Directory -Force -Path dl | Out-Null
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          function Get-ExeFromZip($zipPath, $exeName, $extractDir) {
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
              $found = Get-ChildItem -Recurse -Path $extractDir -Filter $exeName | Select-Object -First 1
              if (-not $found) { throw "Could not find $exeName inside $zipPath" }
              return $found
          }

          # Retry wrappers - GitHub's release/API servers and third-party download hosts
          # occasionally return transient errors (503s, connection resets) under load.
          function Get-FileWithRetry($uri, $outFile, $maxAttempts = 5) {
              for ($i = 1; $i -le $maxAttempts; $i++) {
                  try {
                      Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $outFile -ErrorAction Stop
                      return
                  } catch {
                      if ($i -eq $maxAttempts) { throw }
                      $wait = [Math]::Min(30, 5 * $i)
                      Write-Host "  download failed ($($_.Exception.Message)), retrying in ${wait}s (attempt $i/$maxAttempts)..."
                      Start-Sleep -Seconds $wait
                  }
              }
          }

          function Get-JsonWithRetry($uri, $maxAttempts = 5) {
              for ($i = 1; $i -le $maxAttempts; $i++) {
                  try {
                      return Invoke-RestMethod -Uri $uri -ErrorAction Stop
                  } catch {
                      if ($i -eq $maxAttempts) { throw }
                      $wait = [Math]::Min(30, 5 * $i)
                      Write-Host "  API call failed ($($_.Exception.Message)), retrying in ${wait}s (attempt $i/$maxAttempts)..."
                      Start-Sleep -Seconds $wait
                  }
              }
          }

          function Invoke-WithRetry([scriptblock]$action, $maxAttempts = 5) {
              for ($i = 1; $i -le $maxAttempts; $i++) {
                  try {
                      & $action
                      if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
                      return
                  } catch {
                      if ($i -eq $maxAttempts) { throw }
                      $wait = [Math]::Min(30, 5 * $i)
                      Write-Host "  command failed ($($_.Exception.Message)), retrying in ${wait}s (attempt $i/$maxAttempts)..."
                      Start-Sleep -Seconds $wait
                  }
              }
          }

          function Step($label, [scriptblock]$action) {
              Write-Host "==> $label"
              try {
                  & $action
              } catch {
                  Write-Host "FAILED: $label"
                  Write-Host $_.Exception.Message
                  Write-Host $_.ScriptStackTrace
                  throw
              }
          }

          Step "ffmpeg + ffprobe (BtbN)" {
              Get-FileWithRetry "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" "dl/ffmpeg.zip"
              $ffmpegExe = Get-ExeFromZip "dl/ffmpeg.zip" "ffmpeg.exe" "dl/ffmpeg"
              Copy-Item $ffmpegExe.FullName Library/ffmpeg.exe
              Copy-Item (Join-Path $ffmpegExe.Directory "ffprobe.exe") Library/ffprobe.exe
          }

          Step "7-Zip (ip7z/7zip)" {
              $sevenZipTag = (Get-JsonWithRetry "https://api.github.com/repos/ip7z/7zip/releases/latest").tag_name
              $sevenZipVer = $sevenZipTag.Replace(".", "")
              Get-FileWithRetry "https://github.com/ip7z/7zip/releases/download/$sevenZipTag/7z$sevenZipVer-extra.7z" "dl/7z-extra.7z"
              New-Item -ItemType Directory -Force -Path "dl/7zextra" | Out-Null
              & $sevenZip x "dl/7z-extra.7z" -o"dl/7zextra" -y | Out-Null
              $sevenZa = Get-ChildItem -Recurse -Path "dl/7zextra" -Filter "7za.exe" | Select-Object -First 1
              Copy-Item $sevenZa.FullName Library/7za.exe
          }

          Step "ExifTool (SourceForge, pinned 13.59)" {
              # SourceForge's /download endpoint serves an HTML mirror-selection interstitial
              # to Invoke-WebRequest instead of the real file. curl -L follows its redirect
              # chain correctly and gets the actual zip.
              # -sS: silent progress meter (its output on stderr can otherwise be treated as a
              # terminating error under PowerShell 7.3+'s $ErrorActionPreference behavior) but
              # still show curl's own error messages on failure.
              Invoke-WithRetry {
                  & curl.exe -sS -L --fail -o "dl/exiftool.zip" "https://sourceforge.net/projects/exiftool/files/exiftool-13.59_64.zip/download"
                  if ($LASTEXITCODE -ne 0) { throw "curl failed downloading ExifTool (exit $LASTEXITCODE)" }
              }
              Expand-Archive -Path "dl/exiftool.zip" -DestinationPath "dl/exiftool" -Force
              $exifDir = Get-ChildItem -Recurse -Path "dl/exiftool" -Filter "exiftool_files" | Select-Object -First 1
              $exifExe = Get-ChildItem -Recurse -Path "dl/exiftool" -Filter "exiftool*.exe" | Select-Object -First 1
              Copy-Item $exifExe.FullName Library/exiftool.exe
              if ($exifDir) { Copy-Item $exifDir.FullName Library/exiftool_files -Recurse }
          }

          Step "yt-dlp" {
              Get-FileWithRetry "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" "Library/yt-dlp.exe"
          }

          Step "tsMuxeR (justdan96 fork, frozen 2.7.0)" {
              Get-FileWithRetry "https://github.com/justdan96/tsMuxer/releases/download/2.7.0/tsMuxer-2.7.0-win64.zip" "dl/tsmuxer.zip"
              $tsMuxerExe = Get-ExeFromZip "dl/tsmuxer.zip" "tsMuxer.exe" "dl/tsmuxer"
              Copy-Item $tsMuxerExe.FullName Library/tsMuxeR.exe
          }

          Step "MediaInfo CLI (pinned 26.05)" {
              Get-FileWithRetry "https://mediaarea.net/download/binary/mediainfo/26.05/MediaInfo_CLI_26.05_Windows_x64.zip" "dl/mediainfo.zip"
              $mediaInfoExe = Get-ExeFromZip "dl/mediainfo.zip" "MediaInfo.exe" "dl/mediainfo"
              Copy-Item $mediaInfoExe.FullName Library/MediaInfo.exe
          }

          Step "Xpdf tools (pinned 4.06)" {
              Get-FileWithRetry "https://dl.xpdfreader.com/xpdf-tools-win-4.06.zip" "dl/xpdf.zip"
              Expand-Archive -Path "dl/xpdf.zip" -DestinationPath "dl/xpdf" -Force
              Get-ChildItem -Recurse -Path "dl/xpdf" -Filter "*.exe" | Where-Object { $_.DirectoryName -like "*bin64*" } | ForEach-Object {
                  Copy-Item $_.FullName "Library/$($_.Name)"
              }
          }

          Step "LibRaw dcraw_emu (pinned 0.22.2)" {
              Get-FileWithRetry "https://www.libraw.org/data/LibRaw-0.22.2-Win64.zip" "dl/libraw.zip"
              $dcrawExe = Get-ExeFromZip "dl/libraw.zip" "dcraw_emu.exe" "dl/libraw"
              Copy-Item $dcrawExe.FullName Library/dcraw_emu.exe
          }

          Step "bmxtranswrap (bbc/bmx)" {
              $bmxTag = (Get-JsonWithRetry "https://api.github.com/repos/bbc/bmx/releases/latest").tag_name
              $bmxVer = $bmxTag.TrimStart("v")
              Get-FileWithRetry "https://github.com/bbc/bmx/releases/download/$bmxTag/bmx-win64-binary-$bmxVer.zip" "dl/bmx.zip"
              $bmxExe = Get-ExeFromZip "dl/bmx.zip" "bmxtranswrap.exe" "dl/bmx"
              Copy-Item $bmxExe.FullName Library/bmxtranswrap.exe
          }

          Get-ChildItem Library | Format-Table Name, Length

      # ------------------------------------------------------------------
      # Package: two-phase jpackage (app-image, then wrap into an EXE
      # installer) so Languages/fonts/Library can be injected into the
      # app/ folder before the installer is built - the app resolves
      # those paths relative to its own jar location at runtime.
      # ------------------------------------------------------------------
      - name: jpackage - build app image
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --name "Shutter Encoder" `
            --input pkg_input `
            --main-jar shutter-encoder-main.jar `
            --main-class shutterencoder.ui.main.Shutter `
            --icon logo.ico `
            --add-modules java.base,java.datatransfer,java.desktop,java.logging,java.security.sasl,java.xml,jdk.crypto.ec `
            --dest pkg_out `
            --app-version "${{ steps.version.outputs.version }}" `
            --vendor "Paul Pacifico"

      - name: Inject resources into app image
        shell: pwsh
        run: |
          $appImage = "pkg_out/Shutter Encoder"
          # Languages/Library resolve relative to the app's own jar location at runtime (app/)
          Copy-Item Languages "$appImage/app/Languages" -Recurse
          Copy-Item Library "$appImage/app/Library" -Recurse
          # Fonts aren't loaded by app code - per the README they're picked up automatically
          # by placing them inside the bundled JRE's own font directory
          New-Item -ItemType Directory -Force -Path "$appImage/runtime/lib/fonts" | Out-Null
          Copy-Item fonts/*.ttf "$appImage/runtime/lib/fonts/"
          Copy-Item fonts/*.otf "$appImage/runtime/lib/fonts/" -ErrorAction SilentlyContinue

      - name: Sign app executable (self-signed)
        shell: pwsh
        run: |
          # Windows Defender's real-time scan briefly locks freshly-written exes to scan
          # them, which can race with signing ("Access to the path is denied"). Retry with
          # backoff rather than fail on that transient lock.
          $cert = Get-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          $targetFile = "pkg_out/Shutter Encoder/Shutter Encoder.exe"
          Set-ItemProperty -Path $targetFile -Name IsReadOnly -Value $false -ErrorAction SilentlyContinue

          $maxAttempts = 6
          # Status "UnknownError" (chain terminates in an untrusted root) is EXPECTED for a
          # self-signed cert - it means signing succeeded but the trust chain isn't (and can't
          # be) validated, not that anything failed. Only retry on an actual thrown exception
          # (e.g. the Defender file-lock race) or a status that means signing never applied.
          $acceptableStatuses = @("Valid", "UnknownError")
          for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                  $sig = Set-AuthenticodeSignature -FilePath $targetFile -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -ErrorAction Stop
                  if ($acceptableStatuses -notcontains $sig.Status) { throw "Signature status: $($sig.Status) - $($sig.StatusMessage)" }
                  Write-Host "Signed OK on attempt $i (status: $($sig.Status))"
                  break
              } catch {
                  if ($i -eq $maxAttempts) { throw }
                  Write-Host "Attempt $i failed ($($_.Exception.Message)), retrying in 5s..."
                  Start-Sleep -Seconds 5
              }
          }

      - name: jpackage - build EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_out | Out-Null
          jpackage `
            --type exe `
            --name "Shutter Encoder" `
            --app-image "pkg_out/Shutter Encoder" `
            --icon logo.ico `
            --dest installer_out `
            --app-version "${{ steps.version.outputs.version }}" `
            --vendor "Paul Pacifico" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      - name: Sign installer (self-signed)
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          $maxAttempts = 6
          # See the app-exe signing step for why "UnknownError" is an accepted status here.
          $acceptableStatuses = @("Valid", "UnknownError")

          Get-ChildItem installer_out/*.exe | ForEach-Object {
              $file = $_.FullName
              Set-ItemProperty -Path $file -Name IsReadOnly -Value $false -ErrorAction SilentlyContinue
              for ($i = 1; $i -le $maxAttempts; $i++) {
                  try {
                      $sig = Set-AuthenticodeSignature -FilePath $file -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -ErrorAction Stop
                      if ($acceptableStatuses -notcontains $sig.Status) { throw "Signature status: $($sig.Status) - $($sig.StatusMessage)" }
                      Write-Host "$($_.Name): signed OK on attempt $i (status: $($sig.Status))"
                      break
                  } catch {
                      if ($i -eq $maxAttempts) { throw }
                      Write-Host "$($_.Name): attempt $i failed ($($_.Exception.Message)), retrying in 5s..."
                      Start-Sleep -Seconds 5
                  }
              }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutter-encoder-installer
          path: installer_out/*.exe

      # ------------------------------------------------------------------
      - name: Publish GitHub release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Shutter Encoder v${{ steps.version.outputs.version }}
          files: installer_out/*.exe
          generate_release_notes: true
