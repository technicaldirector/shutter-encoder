name: Build Windows Installer

# Manual trigger only - go to the Actions tab and click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App/release version (e.g. 20.3.0)"
        required: true
        default: "20.2.1"
      create_release:
        description: "Publish a GitHub release with the installer attached"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # jpackage's --type exe needs WiX Toolset. windows-latest runners are
      # documented to include it, but installing defensively here costs
      # ~seconds if it's already present and avoids a hard failure if that
      # ever changes.
      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wixBin = Get-ChildItem "C:\Program Files*\WiX*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wixBin) {
              Add-Content $env:GITHUB_PATH $wixBin.FullName
            }
          }

      # ------------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------------
      - name: Compile Java sources
        shell: pwsh
        run: |
          # Compile from the app's actual entry point only, with -sourcepath so javac
          # pulls in every class transitively referenced from it. Do NOT explicitly list
          # every .java file under src/shutterencoder - that force-compiles PDF.java too,
          # which references a nonexistent VideoPlayer class (pre-existing dead code, not
          # reachable from the app's real entry point, so it's never actually needed).
          $classpath = (Get-ChildItem -Path src/libs -Filter *.jar | ForEach-Object { $_.FullName }) -join ";"
          javac -encoding UTF-8 -nowarn -Xlint:none -cp "$classpath" -d classes -sourcepath src src/shutterencoder/ui/main/Shutter.java

      - name: Build main jar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg_input | Out-Null
          Copy-Item src/libs/*.jar pkg_input/
          jar --create --file pkg_input/shutter-encoder-main.jar --main-class shutterencoder.ui.main.Shutter -C classes .
          jar --update --file pkg_input/shutter-encoder-main.jar -C src resources

      - name: Generate Windows icon from logo.png
        shell: pwsh
        run: |
          @'
          import struct
          with open("logo.png", "rb") as f:
              png_data = f.read()
          header = struct.pack("<HHH", 0, 1, 1)
          entry = struct.pack("<BBBBHHII", 0, 0, 0, 0, 1, 32, len(png_data), 6 + 16)
          with open("logo.ico", "wb") as f:
              f.write(header)
              f.write(entry)
              f.write(png_data)
          '@ | Set-Content -Path make_icon.py -Encoding utf8
          python make_icon.py

      # ------------------------------------------------------------------
      # Third-party tools bundled into Library/
      #
      # Pinned versions (no reliable "latest" alias for these hosts) -
      # bump these manually when a newer release is needed:
      #   ExifTool   13.59   (sourceforge.net/projects/exiftool)
      #   MediaInfo  26.05   (mediaarea.net/en/MediaInfo/Download/Windows)
      #   Xpdf tools 4.06    (xpdfreader.com/download.html)
      #   LibRaw     0.22.2  (libraw.org/download)
      #
      # Resolved dynamically via GitHub's API/stable aliases:
      #   ffmpeg (BtbN "latest" tag), yt-dlp (releases/latest), 7-Zip
      #   (ip7z/7zip), tsMuxeR (justdan96/tsMuxer), bmx (bbc/bmx)
      #
      # NOT bundled: dvdauthor. The upstream project (dvdauthor.sourceforge.net)
      # only publishes source (last binary was 0.6.9 from 2010); no current,
      # trustworthy prebuilt Windows binary exists. DVD-authoring features
      # will show the app's normal "tool not found" behavior until this is
      # revisited (e.g. building from source, or extracting dvdauthor.exe
      # from a DVDStyler release).
      # ------------------------------------------------------------------
      - name: Download third-party tools into Library/
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path Library | Out-Null
          New-Item -ItemType Directory -Force -Path dl | Out-Null
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          function Get-ExeFromZip($zipPath, $exeName, $extractDir) {
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
              $found = Get-ChildItem -Recurse -Path $extractDir -Filter $exeName | Select-Object -First 1
              if (-not $found) { throw "Could not find $exeName inside $zipPath" }
              return $found
          }

          # --- ffmpeg + ffprobe (BtbN, stable 'latest' tag, static GPL build) ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "dl/ffmpeg.zip"
          $ffmpegExe = Get-ExeFromZip "dl/ffmpeg.zip" "ffmpeg.exe" "dl/ffmpeg"
          Copy-Item $ffmpegExe.FullName Library/ffmpeg.exe
          Copy-Item (Join-Path $ffmpegExe.Directory "ffprobe.exe") Library/ffprobe.exe

          # --- 7-Zip (7za.exe console version, via ip7z/7zip GitHub) ---
          $sevenZipTag = (Invoke-RestMethod -Uri "https://api.github.com/repos/ip7z/7zip/releases/latest").tag_name
          $sevenZipVer = $sevenZipTag.Replace(".", "")
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/ip7z/7zip/releases/download/$sevenZipTag/7z$sevenZipVer-extra.7z" -OutFile "dl/7z-extra.7z"
          New-Item -ItemType Directory -Force -Path "dl/7zextra" | Out-Null
          & $sevenZip x "dl/7z-extra.7z" -o"dl/7zextra" -y | Out-Null
          $sevenZa = Get-ChildItem -Recurse -Path "dl/7zextra" -Filter "7za.exe" | Select-Object -First 1
          Copy-Item $sevenZa.FullName Library/7za.exe

          # --- ExifTool (pinned 13.59, SourceForge) ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://sourceforge.net/projects/exiftool/files/exiftool-13.59_64.zip/download" -OutFile "dl/exiftool.zip"
          Expand-Archive -Path "dl/exiftool.zip" -DestinationPath "dl/exiftool" -Force
          $exifDir = Get-ChildItem -Recurse -Path "dl/exiftool" -Filter "exiftool_files" | Select-Object -First 1
          $exifExe = Get-ChildItem -Recurse -Path "dl/exiftool" -Filter "exiftool*.exe" | Select-Object -First 1
          Copy-Item $exifExe.FullName Library/exiftool.exe
          if ($exifDir) { Copy-Item $exifDir.FullName Library/exiftool_files -Recurse }

          # --- yt-dlp (stable latest/download alias) ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "Library/yt-dlp.exe"

          # --- tsMuxeR (frozen final release 2.7.0, justdan96 fork) ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/justdan96/tsMuxer/releases/download/2.7.0/tsMuxer-2.7.0-win64.zip" -OutFile "dl/tsmuxer.zip"
          $tsMuxerExe = Get-ExeFromZip "dl/tsmuxer.zip" "tsMuxer.exe" "dl/tsmuxer"
          Copy-Item $tsMuxerExe.FullName Library/tsMuxeR.exe

          # --- MediaInfo CLI (pinned 26.05, mediaarea.net) ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://mediaarea.net/download/binary/mediainfo/26.05/MediaInfo_CLI_26.05_Windows_x64.zip" -OutFile "dl/mediainfo.zip"
          $mediaInfoExe = Get-ExeFromZip "dl/mediainfo.zip" "MediaInfo.exe" "dl/mediainfo"
          Copy-Item $mediaInfoExe.FullName Library/MediaInfo.exe

          # --- Xpdf tools (pinned 4.06) ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://dl.xpdfreader.com/xpdf-tools-win-4.06.zip" -OutFile "dl/xpdf.zip"
          Expand-Archive -Path "dl/xpdf.zip" -DestinationPath "dl/xpdf" -Force
          Get-ChildItem -Recurse -Path "dl/xpdf" -Filter "*.exe" | Where-Object { $_.DirectoryName -like "*bin64*" } | ForEach-Object {
              Copy-Item $_.FullName "Library/$($_.Name)"
          }

          # --- LibRaw dcraw_emu (pinned 0.22.2) - replaces the unmaintained standalone dcraw.exe ---
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.libraw.org/data/LibRaw-0.22.2-Win64.zip" -OutFile "dl/libraw.zip"
          $dcrawExe = Get-ExeFromZip "dl/libraw.zip" "dcraw_emu.exe" "dl/libraw"
          Copy-Item $dcrawExe.FullName Library/dcraw_emu.exe

          # --- bmxtranswrap (bbc/bmx, resolved via GitHub API) ---
          $bmxTag = (Invoke-RestMethod -Uri "https://api.github.com/repos/bbc/bmx/releases/latest").tag_name
          $bmxVer = $bmxTag.TrimStart("v")
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/bbc/bmx/releases/download/$bmxTag/bmx-win64-binary-$bmxVer.zip" -OutFile "dl/bmx.zip"
          $bmxExe = Get-ExeFromZip "dl/bmx.zip" "bmxtranswrap.exe" "dl/bmx"
          Copy-Item $bmxExe.FullName Library/bmxtranswrap.exe

          Get-ChildItem Library | Format-Table Name, Length

      # ------------------------------------------------------------------
      # Package: two-phase jpackage (app-image, then wrap into an EXE
      # installer) so Languages/fonts/Library can be injected into the
      # app/ folder before the installer is built - the app resolves
      # those paths relative to its own jar location at runtime.
      # ------------------------------------------------------------------
      - name: jpackage - build app image
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --name "Shutter Encoder" `
            --input pkg_input `
            --main-jar shutter-encoder-main.jar `
            --main-class shutterencoder.ui.main.Shutter `
            --icon logo.ico `
            --add-modules java.base,java.datatransfer,java.desktop,java.logging,java.security.sasl,java.xml,jdk.crypto.ec `
            --dest pkg_out `
            --app-version "${{ inputs.version }}" `
            --vendor "Paul Pacifico"

      - name: Inject resources into app image
        shell: pwsh
        run: |
          $appImage = "pkg_out/Shutter Encoder"
          # Languages/Library resolve relative to the app's own jar location at runtime (app/)
          Copy-Item Languages "$appImage/app/Languages" -Recurse
          Copy-Item Library "$appImage/app/Library" -Recurse
          # Fonts aren't loaded by app code - per the README they're picked up automatically
          # by placing them inside the bundled JRE's own font directory
          New-Item -ItemType Directory -Force -Path "$appImage/runtime/lib/fonts" | Out-Null
          Copy-Item fonts/*.ttf "$appImage/runtime/lib/fonts/"
          Copy-Item fonts/*.otf "$appImage/runtime/lib/fonts/" -ErrorAction SilentlyContinue

      - name: jpackage - build EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_out | Out-Null
          jpackage `
            --type exe `
            --name "Shutter Encoder" `
            --app-image "pkg_out/Shutter Encoder" `
            --icon logo.ico `
            --dest installer_out `
            --app-version "${{ inputs.version }}" `
            --vendor "Paul Pacifico" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: shutter-encoder-installer
          path: installer_out/*.exe

      # ------------------------------------------------------------------
      - name: Publish GitHub release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Shutter Encoder v${{ inputs.version }}
          files: installer_out/*.exe
          generate_release_notes: true
